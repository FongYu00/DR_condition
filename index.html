<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keyword-Based Chatbot</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: #f5f7fa;
            font-family: 'Segoe UI', sans-serif;
            color: #000000;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
        }

        .chatbox {
            display: flex;
            flex-direction: column;
            width: 95%;
            max-width: 600px;
            height: 100%;
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            border: 1px solid #ddd;
        }

        .chat-display {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            background-color: #ffffff;
            font-size: 16px;
            line-height: 1.5;
            display: flex;
            flex-direction: column;
        }

        .chat-message {
            max-width: 90%;
            padding: 12px 16px;
            margin: 8px;
            border-radius: 16px;
            position: relative;

            white-space: pre-wrap;
            word-break: keep-all;
            overflow-wrap: break-word;

            line-height: 1.55;
        }

        .chat-message.user {
            align-self: flex-end;
            background-color: #d0e8ff;
            color: #000000;
            margin-left: auto;
            border-bottom-right-radius: 4px;
        }

        .chat-message.bot {
            align-self: flex-start;
            background-color: #d6f7da;
            color: #000000;
            margin-right: auto;
            border-bottom-left-radius: 4px;
        }

        .input-area {
            display: flex;
            border-top: 1px solid #ddd;
            background-color: #ffffff;
        }

        .input-area input {
            flex-grow: 1;
            padding: 35px;
            border: none;
            background-color: #f2f2f2;
            color: #000000;
            font-size: 16px;
            outline: none;
            border-top-left-radius: 10px;
            border-bottom-left-radius: 10px;
        }

        .input-area button {
            padding: 15px 25px;
            border: none;
            background-color: #4CAF50;
            color: white;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            border-top-right-radius: 10px;
            border-bottom-right-radius: 10px;
            transition: background-color 0.3s;
        }

        .input-area button:hover {
            background-color: #45a049;
        }

        .paragraph-divider {
            border: none;
            border-top: 1px solid #7c7c7c;
            margin: 24px 0;
        }

        .chat-message .bullet {
            display: block;
            padding-left: 1.8em;
            text-indent: -0.8em;
        }
    </style>
</head>

<body>
<div class="container">
    <div class="chatbox">
        <div class="chat-display" id="chatDisplay"></div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="무엇이든 물어보세요."
                   autocomplete="off" autocorrect="off"
                   autocapitalize="off" spellcheck="false">
            <button id="sendButton" type="button">보내기</button>
        </div>
    </div>
</div>

<script>
/* =========================
   1. SoSci CASE ID 가져오기
   ========================= */
const urlParams = new URLSearchParams(window.location.search);
const socsiCaseId = urlParams.get("case");

console.log("SoSci CASE ID:", socsiCaseId);


/* =========================
   2. Google Script URL
   ========================= */
const GOOGLE_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbz337BAh86d_zEnez0V-T49k4FyJiON5-Sgug_CEskZ3rxotGL76UJP4dGgQmlt2_pXqg/exec";


/* =========================
   3. DOM 요소
   ========================= */
const chatDisplay = document.getElementById("chatDisplay");
const userInput = document.getElementById("userInput");
const sendButton = document.getElementById("sendButton");


/* =========================
   4. 참가자 ID
   ========================= */
const participantId = getOrCreateParticipantId();

console.log("참가자 ID:", participantId);


/* =========================
   5. 이벤트 등록
   ========================= */
sendButton.addEventListener("click", handleSubmit);

userInput.addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
        e.preventDefault();
        handleSubmit();
    }
});


/* =========================
   6. 저장 전용 함수
   ========================= */
function saveChatLog(userText, botText, answerType) {
    fetch(GOOGLE_SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: {
            "Content-Type": "text/plain"
        },
        body: JSON.stringify({
            caseId: socsiCaseId,
            participantId: participantId,
            userMessage: userText,
            botResponse: botText,
            answerType: answerType,
            timestamp: new Date().toISOString()
        })
    })
    .catch(function(err) {
        console.error("저장 실패:", err);
    });
}


/* =========================
   7. 키워드 기반 응답 데이터

   중요:
   아래 responses 배열 안에는
   네가 기존에 작성한 응답 데이터 전체를 그대로 넣으면 됨.
   ========================= */
const responses = [

    {
        keywords: [
            { word: "범죄율", weight: 3 },
            { word: "감소", weight: 3 },
            { word: "처벌", weight: 2 },
            { word: "강화", weight: 2 },
            { word: "예방", weight: 2 },
            { word: "정책", weight: 2 }
        ],
        answer:
        "짧게 말하면, <strong>전반적인 범죄율 감소에는 '예방 프로그램 확대'가 평균적으로 더 효과적</strong>이며, <strong>처벌 강화는 특정 범죄·특정 조건에서 제한적으로 효과</strong>를 보입니다. 다만 두 접근은 <strong>대체 관계가 아니라 보완 관계</strong>에 가깝습니다.<br><br>"
        + "아래에서 근거를 나눠 설명할게요.<br>"
        + "------------"
        + "<strong>1. 처벌 강화 정책의 효과와 한계</strong><br><br>"
        + "<strong>효과가 나타나는 조건</strong><br><br>"
        + "<strong>• 처벌의 확실성</strong>이 높아질 때 (잡힐 가능성이 높고, 집행이 일관될 때)<br>"
        + "<strong>• 단기 억제 효과</strong> 특정 범죄 유형 (음주운전 단속, 불법 주정차 등)에서는 일시적 감소<br><br>"
        + "<strong>한계</strong><br>"
        + "• <strong>처벌 수위 자체(형량 증가)는 범죄 억제 효과가 약함</strong><br>"
        + "• 충동범죄·중독·빈곤 기반 범죄에는 효과 미미<br>"
        + "• 과도한 처벌은<br>"
        + "<span class='bullet'>• 재범률 증가</span>"
        + "<span class='bullet'>• 사회적 낙인 효과 강화</span>"
        + "------------"
        + "<strong>2. 예방 프로그램 확대의 효과</strong><br><br>"
        + "예방이 효과적인 이유<br>"
        + "예방은 범죄의 <strong>원인 자체를 줄이는 접근</strong>이기 때문입니다.<br><br>"
        + "대표적 예:<br>"
        + "• 아동·청소년 교육 및 돌봄<br>"
        + "• 중독 치료, 정신건강 서비스<br>"
        + "• 지역사회 기반 범죄 예방(환경 설계, 커뮤니티 강화)<br>"
        + "------------"
        + "<strong>3. 가장 효과적인 전략은?</strong><br>"
        + "<strong>처벌의 확실성 + 예방의 확장</strong><br>"
        + "• 처벌: 빠르고 일관되게, 과도하지 않게<br>"
        + "• 예방: 교육·복지·지역사회에 지속 투자<br><br>"
        + "즉,<br>"
        + "<strong>• 처벌은 '바닥선'</strong><br>"
        + "<strong>• 예방은 '근본 해결책'</strong><br>"
        + "------------"
        + "한 문장 결론:<br>"
        + "<strong>범죄율 감소를 목표로 할 때, 처벌 강화는 보조 수단이고 예방 프로그램 확대가 핵심 전략이다.</strong>"
    },

    {
        keywords: [
            { word: "동일한", weight: 3 },
            { word: "규칙", weight: 3 },
            { word: "모든", weight: 2 },
            { word: "적용", weight: 2 },
            { word: "공정", weight: 2 }
        ],
        answer:
        "짧은 답부터 말하면, <strong>동일한 규칙을 모든 사람에게 적용하는 것이 항상 가장 공정한 선택은 아닙니다.</strong><br>"
        + "공정성은 단순한 <strong>동일 대우</strong>가 아니라, <strong>어떤 차이를 고려해야 하는가</strong>의 문제이기 때문입니다.<br>"
        + "------------"
        + "1. "같게 대우하는 것"이 왜 공정해 보이는가<br>"
        + "동일 규칙 적용은 흔히 <strong>형식적 평등</strong>이라 불립니다.<br><br>"
        + "<strong>장점</strong><br>"
        + "• 자의성·특혜를 줄임<br>"
        + "• 규칙이 명확하고 예측 가능<br>"
        + "• 법치주의와 잘 맞음<br><br>"
        + "👉 문제는, <strong>사람들이 정말 '같은 조건'에 있는가</strong>입니다.<br>"
        + "------------"
        + "<strong>2. 왜 동일 규칙이 불공정해질 수 있는가</strong><br><br>"
        + "<strong>출발선이 다른 경우</strong><br>"
        + "<span class='bullet'>• 장애 유무<br></span>"
        + "<span class='bullet'>• 사회경제적 배경<br></span>"
        + "<span class='bullet'>• 성별·돌봄 부담<br></span><br>"
        + "이 상황에서 동일 규칙은 <strong>중립적으로 보이지만 실제로는 불리함을 고착</strong>시킬 수 있습니다.<br><br>"
        + "📌 예:<br>"
        + "<span class='bullet'>• 시험 시간 동일 적용 → 시각장애인에게 불리</span>"
        + "<span class='bullet'>• 동일한 벌금 → 저소득층에 더 큰 타격</span><br>"
        + "이때 동일 규칙은 <strong>차별이 아니라 불평등을 '방치'하는 방식</strong>이 됩니다.<br>"
        + "------------"
        + "<strong>3. 실질적 공정성: 차이를 고려한 규칙</strong><br>"
        + "이 접근은 <strong>실질적 평등(equity)</strong>을 중시합니다.<br>"
        + "<strong>핵심 질문</strong>"
        + "<span class='bullet'>"모두에게 같은 규칙이 아니라,</span>"
        + "<span class='bullet'> 모두에게 <strong>비슷한 기회와 결과</strong>를 주는 규칙은 무엇인가?"</span><br>"
        + "• 불평등은 허용될 수 있지만<br>"
        + "• <strong>최소 수혜자에게 이익이 되는 방식</strong>이어야 함<br><br>"
        + "👉 따라서 일부 집단에 대한 <strong>조정·보완·예외</strong>는<br>"
        + "특혜가 아니라 <strong>공정성을 회복하기 위한 장치</strong>가 됩니다.<br>"
        + "------------"
        + "<strong>한 문장 결론</strong><br><br>"
        + "<strong>공정함이란 모두를 똑같이 대하는 것이 아니라, 각자의 조건을 고려해 '정당하게' 대하는 것이다.</strong>"
    }

    /*
      여기에 네 기존 responses 항목들을 계속 이어서 넣으면 됨.

      중요한 점:
      - 위 예시처럼 객체와 객체 사이에는 쉼표가 필요함.
      - 마지막 객체 뒤에는 쉼표가 없어도 됨.
      - answer 문자열 안의 HTML 태그는 그대로 사용 가능함.
    */
];


/* =========================
   8. 답변 구분선 포맷
   ========================= */
function formatAnswerWithDivider(text) {
    return text
        .split("------------")
        .map(function(p) {
            return p.trim();
        })
        .join('<hr class="paragraph-divider">');
}


/* =========================
   9. 이전 질문 중복 방지
   ========================= */
const answeredResponseIndexes = new Set(
    JSON.parse(sessionStorage.getItem("answeredResponseIndexes") || "[]")
);

function markResponseAsAnswered(index) {
    answeredResponseIndexes.add(index);

    sessionStorage.setItem(
        "answeredResponseIndexes",
        JSON.stringify(Array.from(answeredResponseIndexes))
    );
}


/* =========================
   10. 메시지 처리 설정
   ========================= */
const NORMAL_DELAY_SECONDS = 20;
const SPECIAL_DELAY_SECONDS = 3;

const DUPLICATE_MESSAGE =
    "이 질문은 이전에 다룬 질문과 유사한 내용입니다. 다른 질문을 해주세요.";

const INVALID_MESSAGE =
    "죄송해요, 무슨 말인지 잘 모르겠어요.";


/* =========================
   11. 답변 종류 판별
   ========================= */
function getAnswerType(message) {
    let bestAnswer = null;
    let bestIndex = -1;
    let highestScore = 0;

    for (let i = 0; i < responses.length; i++) {
        const item = responses[i];
        let score = 0;

        for (const keywordObj of item.keywords) {
            if (message.includes(keywordObj.word)) {
                score += keywordObj.weight;
            }
        }

        if (score > highestScore) {
            highestScore = score;
            bestAnswer = item.answer;
            bestIndex = i;
        }
    }

    /*
      1. 이해할 수 없는 질문
    */
    if (bestIndex === -1) {
        return {
            answer: INVALID_MESSAGE,
            type: "invalid",
            delay: SPECIAL_DELAY_SECONDS
        };
    }

    /*
      2. 이전에 답변한 질문
    */
    if (answeredResponseIndexes.has(bestIndex)) {
        return {
            answer: DUPLICATE_MESSAGE,
            type: "duplicate",
            delay: SPECIAL_DELAY_SECONDS
        };
    }

    /*
      3. 새로운 정상 질문
    */
    markResponseAsAnswered(bestIndex);

    return {
        answer: bestAnswer,
        type: "normal",
        delay: NORMAL_DELAY_SECONDS
    };
}


/* =========================
   12. 질문 제출
   ========================= */
function handleSubmit() {
    const message = userInput.value.trim();

    if (!message) {
        return;
    }

    /*
      중복 클릭 방지
    */
    userInput.disabled = true;
    sendButton.disabled = true;

    /*
      1. 사용자 질문 표시
    */
    addMessage(message, "user");

    userInput.value = "";

    /*
      2. 답변 종류 확인
    */
    const result = getAnswerType(message);

    const rawAnswer = result.answer;
    const delaySeconds = result.delay;

    console.log("질문:", message);
    console.log("답변 유형:", result.type);
    console.log("응답 지연:", delaySeconds + "초");

    /*
      3. 로딩 메시지
    */
    const loading = document.createElement("div");

    loading.className = "chat-message bot";
    loading.textContent = "⏳ 잠시만 기다려 주세요...";

    chatDisplay.appendChild(loading);
    scrollToBottom();

    /*
      4. 응답 지연
    */
    setTimeout(function() {
        /*
          로딩 메시지 제거
        */
        if (loading && loading.parentNode) {
            loading.parentNode.removeChild(loading);
        }

        /*
          5. 답변 출력
        */
        const formattedAnswer = formatAnswerWithDivider(rawAnswer);

        typeMessage(formattedAnswer, "bot");

        /*
          6. Google Sheet 저장
        */
        saveChatLog(message, formattedAnswer, result.type);

        /*
          7. 입력창 다시 활성화
        */
        userInput.disabled = false;
        sendButton.disabled = false;
        userInput.focus();

    }, delaySeconds * 1000);
}


/* =========================
   13. 메시지 출력 함수
   ========================= */
function addMessage(text, sender) {
    const msg = document.createElement("div");
    msg.className = `chat-message ${sender}`;

    if (sender === "user") {
        /*
          사용자 입력은 HTML로 해석하지 않음.
          XSS 방지 목적.
        */
        msg.textContent = text;
    } else {
        /*
          봇 답변은 <strong>, <br>, <hr> 등을 사용하므로 HTML 허용.
        */
        msg.innerHTML = text;
    }

    chatDisplay.appendChild(msg);
    scrollToBottom();
}


/* =========================
   14. 타이핑 애니메이션
   ========================= */
function typeMessage(text, sender) {
    const msg = document.createElement("div");
    msg.className = `chat-message ${sender}`;
    chatDisplay.appendChild(msg);

    let i = 0;
    let buffer = "";

    const typing = setInterval(function() {
        if (i >= text.length) {
            clearInterval(typing);
            return;
        }

        /*
          HTML 태그는 한 번에 추가해야 화면에 깨져 보이지 않음.
        */
        if (text[i] === "<") {
            const end = text.indexOf(">", i);

            if (end !== -1) {
                buffer += text.slice(i, end + 1);
                i = end + 1;
            } else {
                buffer += text[i];
                i++;
            }
        } else {
            buffer += text[i];
            i++;
        }

        msg.innerHTML = buffer;
        scrollToBottom();

        if (i >= text.length) {
            clearInterval(typing);
        }

    }, 20);
}


/* =========================
   15. 참가자 ID 생성
   ========================= */
function getOrCreateParticipantId() {
    let pid = localStorage.getItem("participant_id");

    if (!pid) {
        if (window.crypto && crypto.randomUUID) {
            pid = "P_" + crypto.randomUUID();
        } else {
            pid =
                "P_" +
                Date.now() +
                "_" +
                Math.random().toString(36).substring(2, 10);
        }

        localStorage.setItem("participant_id", pid);
    }

    return pid;
}


/* =========================
   16. 스크롤
   ========================= */
function scrollToBottom() {
    chatDisplay.scrollTop = chatDisplay.scrollHeight;
}


/* =========================
   17. 초기 메시지
   ========================= */
addMessage("안녕하세요! 무엇을 도와드릴까요?", "bot");
</script>
</body>
</html>
